<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpressDroid - Uygulama Yükle</title>
    <!-- Supabase JS Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #4CAF50;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #2c2c2c;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Uygulama Yükle</h2>
    <form id="uploadForm">
        <input type="text" id="appName" placeholder="Uygulama Adı" required>
        <textarea id="appDesc" placeholder="Uygulama Açıklaması" rows="4" required></textarea>
        <input type="text" id="appUrl" placeholder="İndirme Linki (APK URL)" required>
        <button type="submit">Yükle</button>
    </form>
    <p id="status" style="text-align: center;"></p>
</div>

<script>
    // Vercel projelerinde Vite veya standart ortam değişkeni kullanımı
    const SUPABASE_URL = 'SENIN_SUPABASE_URL_ADRESIN';
    const SUPABASE_ANON_KEY = 'SENIN_SUPABASE_ANON_KEY_DEGERIN';
    
    // Vercel Environment Variable (Vite tabanlı ise import.meta.env, düz HTML ise build aşamasında inject edilir)
    const GIZLI_TOKEN = typeof process !== 'undefined' && process.env ? process.env.SUPABASE_APP_TOKEN : '&%&%&%&/(/(&%&%&%';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false },
        global: {
            headers: {
                'x-app-token': GIZLI_TOKEN
            }
        }
    });

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('appName').value;
        const description = document.getElementById('appDesc').value;
        const url = document.getElementById('appUrl').value;
        const status = document.getElementById('status');

        status.style.color = '#ff9800';
        status.innerText = 'Yükleniyor...';

        const { data, error } = await _supabase
            .from('AppDB')
            .insert([{ name: name, description: description, url: url }]);

        if (error) {
            status.style.color = '#f44336';
            status.innerText = 'Hata: ' + error.message;
        } else {
            status.style.color = '#4CAF50';
            status.innerText = 'Uygulama başarıyla eklendi!';
            document.getElementById('uploadForm').reset();
        }
    });
</script>

</body>
</html>
