<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpressDroid - Mağaza</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0b0f;
            color: #f1f1f1;
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .app-card {
            background: #161622;
            border: 1px solid #27273d;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .app-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .app-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            margin-right: 15px;
            background: #2e2e48;
        }
        .app-title-group h3 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 2px;
        }
        .app-dev {
            font-size: 12px;
            color: #00ff88;
            margin-bottom: 2px;
        }
        .app-pkg {
            font-size: 11px;
            color: #888;
        }
        .app-desc {
            font-size: 13px;
            color: #b0b0c3;
            margin-bottom: 15px;
            line-height: 1.4;
            flex-grow: 1;
        }
        .app-sha {
            font-size: 10px;
            color: #666;
            word-break: break-all;
            margin-bottom: 15px;
            background: #0d0d14;
            padding: 6px;
            border-radius: 4px;
        }
        .download-btn {
            display: block;
            text-align: center;
            padding: 10px;
            background: #00ff88;
            color: #0b0b0f;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background: #00cc6a;
        }
        .loading {
            text-align: center;
            color: #888;
            grid-column: 1 / -1;
            font-size: 16px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<h1>ExpressDroid Mağaza</h1>

<div id="appGrid" class="app-grid">
    <div class="loading">Uygulamalar yükleniyor...</div>
</div>

<script>
    const SUPABASE_URL = 'SENIN_SUPABASE_URL_ADRESIN';
    const SUPABASE_ANON_KEY = 'SENIN_SUPABASE_ANON_KEY_DEGERIN';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function parseAppText(text) {
        const data = {};
        text.split('\n').forEach(line => {
            const match = line.match(/^\[(.*?)\]=(.*)$/);
            if (match) {
                data[match[1]] = match[2].trim();
            }
        });
        return data;
    }

    async function fetchStoreApps() {
        const grid = document.getElementById('appGrid');
        
        try {
            const { data: dbApps, error: dbError } = await _supabase
                .from('AppDB')
                .select('*');

            if (dbError) throw new Error(dbError.message);

            if (!dbApps || dbApps.length === 0) {
                grid.innerHTML = '<div class="loading">Mağazada henüz uygulama yok.</div>';
                return;
            }

            grid.innerHTML = '';

            for (const app of dbApps) {
                const sanitizedName = app.name.toLowerCase().replace(/[^a-z0-9]/g, '_');
                const textFilePath = `texts/${sanitizedName}.txt`;

                let appDetails = {
                    AppName: app.name,
                    DevName: 'Bilinmeyen Geliştirici',
                    AppDesc: app.description || 'Açıklama bulunamadı.',
                    PackageName: 'Bilinmiyor',
                    SHA256: app.sha256 || 'SHA-256 belirtilmemiş'
                };

                try {
                    const { data: fileData, error: fileError } = await _supabase.storage
                        .from('apks')
                        .download(textFilePath);

                    if (!fileError && fileData) {
                        const textText = await fileData.text();
                        const parsed = parseAppText(textText);
                        appDetails = { ...appDetails, ...parsed };
                    }
                } catch (e) {
                    console.warn(`${sanitizedName}.txt okunamadı, veritabanı verileri kullanılıyor.`);
                }

                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div>
                        <div class="app-header">
                            <img src="${app.icon || 'https://via.placeholder.com/50'}" class="app-icon" alt="İkon">
                            <div class="app-title-group">
                                <h3>${appDetails.AppName}</h3>
                                <div class="app-dev">Geliştirici: ${appDetails.DevName}</div>
                                <span class="app-pkg">${appDetails.PackageName}</span>
                            </div>
                        </div>
                        <p class="app-desc">${appDetails.AppDesc}</p>
                        <div class="app-sha">SHA-256: ${appDetails.SHA256}</div>
                    </div>
                    <a href="${app.url}" class="download-btn" download>APK İndir</a>
                `;
                grid.appendChild(card);
            }

        } catch (err) {
            grid.innerHTML = `<div class="loading" style="color: #ff4d4d;">Hata: ${err.message}</div>`;
        }
    }

    fetchStoreApps();
</script>

</body>
</html>
