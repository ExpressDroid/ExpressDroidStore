<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpressDroid - Yönetim Paneli</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0b0f;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .panel-box {
            background: #161622;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 550px;
            border: 1px solid #27273d;
        }
        h2 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 600;
        }
        .field {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #9494b8;
            font-size: 13px;
            font-weight: 500;
        }
        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #2e2e48;
            border-radius: 8px;
            background-color: #0d0d14;
            color: #fff;
            font-size: 14px;
        }
        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }
        textarea {
            resize: vertical;
            min-height: 70px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #00ff88;
            color: #0b0b0f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: background 0.2s;
            margin-top: 5px;
        }
        .submit-btn:hover {
            background: #00cc6a;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }
        .section-divider {
            margin: 25px 0 20px 0;
            border: 0;
            border-top: 1px solid #27273d;
        }
        .app-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .app-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d0d14;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #2e2e48;
        }
        .app-info span {
            display: block;
        }
        .app-name {
            font-weight: 600;
            color: #fff;
            font-size: 14px;
        }
        .app-id {
            font-size: 11px;
            color: #888;
        }
        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .delete-btn:hover {
            background: #cc3939;
        }
    </style>
</head>
<body>

<div class="panel-box">
    <h2>ExpressDroid Yönetim Paneli</h2>
    
    <form id="uploadForm">
        <div class="field">
            <label for="appName">Uygulama Adı</label>
            <input type="text" id="appName" required>
        </div>
        <div class="field">
            <label for="devName">Geliştirici Adı</label>
            <input type="text" id="devName" placeholder="Adınız / Ekip Adı" required>
        </div>
        <div class="field">
            <label for="appDesc">Açıklama</label>
            <textarea id="appDesc" required></textarea>
        </div>
        <div class="field">
            <label for="packageName">Paket Adı (Package Name)</label>
            <input type="text" id="packageName" placeholder="com.ornek.app" required>
        </div>
        <div class="field">
            <label for="appIconFile">Uygulama İkonu (Görsel)</label>
            <input type="file" id="appIconFile" accept="image/*" required>
        </div>
        <div class="field">
            <label for="appApkFile">APK Dosyası</label>
            <input type="file" id="appApkFile" accept=".apk" required>
        </div>
        <div class="field">
            <label for="appSha">SHA-256</label>
            <input type="text" id="appSha" required>
        </div>
        <button type="submit" class="submit-btn">Dosyaları Yükle ve Kaydet</button>
    </form>

    <hr class="section-divider">

    <h3 style="font-size: 16px; color: #9494b8; margin-bottom: 10px;">Yüklü Uygulamalar (Kaldır)</h3>
    <div id="appListContainer" class="app-list">
        <p style="font-size: 13px; color: #666; text-align: center;">Yüklü uygulama bulunamadı.</p>
    </div>

    <p id="status"></p>
</div>

<script>
    const SUPABASE_URL = 'https://wdsfnygfsigugkaxpvka.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indkc2ZueWdmc2lndWdrYXhwdmthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTM0NTIsImV4cCI6MjEwMjEyOTQ1Mn0.UNauLqKak3JI11RDn-DefGN7Lw8LIT-M7sV4P3sLHLo';
    const GIZLI_TOKEN = '&%&%&%&/(/(&%&%&%';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false },
        global: {
            headers: {
                'x-app-token': GIZLI_TOKEN
            }
        }
    });

    function loadLocalApps() {
        const container = document.getElementById('appListContainer');
        const savedApps = JSON.parse(localStorage.getItem('expressdroid_uploaded_apps') || '[]');

        if (savedApps.length === 0) {
            container.innerHTML = '<p style="font-size: 13px; color: #666; text-align: center;">Yüklü uygulama bulunamadı.</p>';
            return;
        }

        container.innerHTML = '';
        savedApps.forEach(app => {
            const item = document.createElement('div');
            item.className = 'app-item';
            item.innerHTML = `
                <div class="app-info">
                    <span class="app-name">${app.name}</span>
                    <span class="app-id">ID: ${app.id}</span>
                </div>
                <button class="delete-btn" onclick="deleteApp('${app.id}', '${app.textFileName}')">Kaldır</button>
            `;
            container.appendChild(item);
        });
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('appName').value;
        const devName = document.getElementById('devName').value;
        const description = document.getElementById('appDesc').value;
        const packageName = document.getElementById('packageName').value;
        const iconFile = document.getElementById('appIconFile').files[0];
        const apkFile = document.getElementById('appApkFile').files[0];
        const sha256 = document.getElementById('appSha').value;
        const status = document.getElementById('status');

        if (!iconFile || !apkFile) {
            status.style.color = '#ff4d4d';
            status.innerText = 'Lütfen ikon ve APK dosyalarını seçin!';
            return;
        }

        status.style.color = '#ffa500';
        status.innerText = 'Dosyalar yükleniyor...';

        try {
            // 1. Text dosyasını hazırlayıp app-files bucket'ının 'texts/' klasörüne yükle
            const textContent = `[AppName]=${name}\n[DevName]=${devName}\n[AppDesc]=${description}\n[PackageName]=${packageName}\n[SHA256]=${sha256}`;
            const textBlob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            
            const sanitizedName = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const textFileName = `texts/${sanitizedName}.txt`;

            const { error: textError } = await _supabase.storage
                .from('app-files')
                .upload(textFileName, textBlob, { upsert: true });

            if (textError) throw new Error('Text dosyası yüklenemedi: ' + textError.message);

            // 2. İkonu app-files bucket'ının 'icons/' klasörüne yükle
            const iconPath = `icons/${Date.now()}_${iconFile.name}`;
            const { error: iconError } = await _supabase.storage
                .from('app-files')
                .upload(iconPath, iconFile);

            if (iconError) throw new Error('İkon yüklenemedi: ' + iconError.message);
            
            const { data: iconData } = _supabase.storage
                .from('app-files')
                .getPublicUrl(iconPath);

            // 3. APK'yı app-files bucket'ının 'apks/' klasörüne yükle
            const apkPath = `apks/${Date.now()}_${apkFile.name}`;
            const { error: apkError } = await _supabase.storage
                .from('app-files')
                .upload(apkPath, apkFile);

            if (apkError) throw new Error('APK yüklenemedi: ' + apkError.message);

            const { data: apkData } = _supabase.storage
                .from('app-files')
                .getPublicUrl(apkPath);

            // 4. Veritabanına kaydet
            status.innerText = 'Veritabanına kaydediliyor...';
            const { data: insertedData, error: dbError } = await _supabase
                .from('AppDB')
                .insert([{ 
                    name: name, 
                    description: description, 
                    icon: iconData.publicUrl, 
                    url: apkData.publicUrl, 
                    sha256: sha256 
                }])
                .select();

            if (dbError) throw new Error('Veritabanı hatası: ' + dbError.message);

            // LocalStorage'e kaydet
            if (insertedData && insertedData.length > 0) {
                const newApp = insertedData[0];
                const savedApps = JSON.parse(localStorage.getItem('expressdroid_uploaded_apps') || '[]');
                savedApps.push({ id: newApp.id, name: newApp.name, textFileName: textFileName });
                localStorage.setItem('expressdroid_uploaded_apps', JSON.stringify(savedApps));
            }

            status.style.color = '#00ff88';
            status.innerText = 'Uygulama başarıyla eklendi!';
            document.getElementById('uploadForm').reset();
            loadLocalApps();

        } catch (err) {
            status.style.color = '#ff4d4d';
            status.innerText = 'Hata: ' + err.message;
        }
    });

    window.deleteApp = async function(id, textFileName) {
        const status = document.getElementById('status');
        status.style.color = '#ffa500';
        status.innerText = 'Uygulama kaldırılıyor...';

        try {
            // Veritabanından sil
            const { error } = await _supabase
                .from('AppDB')
                .delete()
                .eq('id', id);

            if (error) throw new Error('Silme hatası: ' + error.message);

            // app-files içindeki texts/ klasöründe bulunan ilgili .txt dosyasını sil
            if (textFileName) {
                await _supabase.storage.from('app-files').remove([textFileName]);
            }

            // LocalStorage'den temizle
            let savedApps = JSON.parse(localStorage.getItem('expressdroid_uploaded_apps') || '[]');
            savedApps = savedApps.filter(app => app.id != id);
            localStorage.setItem('expressdroid_uploaded_apps', JSON.stringify(savedApps));

            status.style.color = '#00ff88';
            status.innerText = 'Uygulama başarıyla kaldırıldı!';
            loadLocalApps();
        } catch (err) {
            status.style.color = '#ff4d4d';
            status.innerText = 'Hata: ' + err.message;
        }
    };

    loadLocalApps();
</script>

</body>
</html>
