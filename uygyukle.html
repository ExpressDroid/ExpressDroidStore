<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpressDroid - Uygulama Yükleme Paneli</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0b0f;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .panel-box {
            background: #161622;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 500px;
            border: 1px solid #27273d;
        }
        h2 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .field {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #9494b8;
            font-size: 13px;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #2e2e48;
            border-radius: 8px;
            background-color: #0d0d14;
            color: #fff;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }
        textarea {
            resize: vertical;
            min-height: 90px;
        }
        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #00ff88;
            color: #0b0b0f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: background 0.2s, transform 0.1s;
            margin-top: 5px;
        }
        .submit-btn:hover {
            background: #00cc6a;
        }
        .submit-btn:active {
            transform: scale(0.99);
        }
        #status {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="panel-box">
    <h2>ExpressDroid Yükleme Paneli</h2>
    <form id="uploadForm">
        <div class="field">
            <label for="appName">Uygulama Adı</label>
            <input type="text" id="appName" placeholder="" required>
        </div>
        <div class="field">
            <label for="appDesc">Açıklama</label>
            <textarea id="appDesc" placeholder="" required></textarea>
        </div>
        <div class="field">
            <label for="appIcon">Logo / İkon URL</label>
            <input type="text" id="appIcon" placeholder="" required>
        </div>
        <div class="field">
            <label for="appUrl">APK İndirme Linki / Paket Adı</label>
            <input type="text" id="appUrl" placeholder="" required>
        </div>
        <div class="field">
            <label for="appSha">SHA-256 (Opsiyonel)</label>
            <input type="text" id="appSha" placeholder="">
        </div>
        <button type="submit" class="submit-btn">Uygulamayı Yükle</button>
    </form>
    <p id="status"></p>
</div>

<script>
    const SUPABASE_URL = 'SENIN_SUPABASE_URL_ADRESIN';
    const SUPABASE_ANON_KEY = 'SENIN_SUPABASE_ANON_KEY_DEGERIN';
    const GIZLI_TOKEN = typeof process !== 'undefined' && process.env && process.env.SUPABASE_APP_TOKEN ? process.env.SUPABASE_APP_TOKEN : '&%&%&%&/(/(&%&%&%';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false },
        global: {
            headers: {
                'x-app-token': GIZLI_TOKEN
            }
        }
    });

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('appName').value;
        const description = document.getElementById('appDesc').value;
        const icon = document.getElementById('appIcon').value;
        const url = document.getElementById('appUrl').value;
        const sha256 = document.getElementById('appSha').value;
        const status = document.getElementById('status');

        status.style.color = '#ffa500';
        status.innerText = 'Yükleniyor...';

        const { data, error } = await _supabase
            .from('AppDB')
            .insert([{ 
                name: name, 
                description: description, 
                icon: icon, 
                url: url, 
                sha256: sha256 
            }]);

        if (error) {
            status.style.color = '#ff4d4d';
            status.innerText = 'Hata: ' + error.message;
        } else {
            status.style.color = '#00ff88';
            status.innerText = 'Uygulama başarıyla eklendi!';
            document.getElementById('uploadForm').reset();
        }
    });
</script>

</body>
</html>
