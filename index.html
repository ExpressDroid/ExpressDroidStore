<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpressDroid - APK Mağazası</title>
  
  <!-- Supabase JS Kütüphanesi -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #00e676;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 10px 0;
    }

    header h1 {
      color: var(--accent-color);
      font-size: 2rem;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-color);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-header img {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover;
      background-color: #2a2a2a;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-desc {
      color: #cccccc;
      font-size: 0.88rem;
      line-height: 1.4;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .badge-shield {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 230, 118, 0.1);
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid var(--accent-color);
      margin-bottom: 15px;
      width: fit-content;
    }

    .badge-pending {
      color: #ffb74d;
      border-color: #ffb74d;
      background: rgba(255, 183, 77, 0.1);
    }

    .download-btn {
      display: block;
      text-align: center;
      background: var(--accent-color);
      color: #000000;
      font-weight: 700;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      transition: opacity 0.2s;
    }

    .download-btn:hover {
      opacity: 0.9;
    }

    .status-msg {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>ExpressDroid</h1>
    </header>

    <main id="app-list" class="grid">
      <div class="status-msg">Uygulamalar yükleniyor...</div>
    </main>
  </div>

  <script>
    // Supabase Bağlantı Bilgileri
    const SUPABASE_URL = 'https://wdsfnygfsigugkaxpvka.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_publishable_imHucyg80qgs-Tj8pu52BA_FYBUGpZX';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Verileri Veritabanından Çeken Fonksiyon
    async function uygulamalariYukle() {
      const container = document.getElementById('app-list');

      const { data: apps, error } = await supabase
        .from('AppDB')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Veri çekme hatası:', error);
        container.innerHTML = `<div class="status-msg">Veriler yüklenirken hata oluştu: ${error.message}</div>`;
        return;
      }

      if (!apps || apps.length === 0) {
        container.innerHTML = '<div class="status-msg">Henüz hiç uygulama eklenmemiş.</div>';
        return;
      }

      container.innerHTML = '';

      apps.forEach(app => {
        const shieldBadge = app.shield_status 
          ? `<div class="badge-shield">🛡️ ExpressDroid Shield™ Onaylı</div>`
          : `<div class="badge-shield badge-pending">⏳ Taramada</div>`;

        const cardHTML = `
          <article class="card">
            <div>
              <div class="card-header">
                <img src="${app.icon_url || 'https://via.placeholder.com/60'}" alt="${app.title}">
                <div>
                  <h2 class="card-title">${app.title}</h2>
                  <div class="card-meta">v${app.version || '1.0'} • ${app.category || 'Genel'}</div>
                </div>
              </div>
              <p class="card-desc">${app.description || 'Açıklama bulunmuyor.'}</p>
            </div>
            <div>
              ${shieldBadge}
              <a href="${app.apk_url}" class="download-btn" target="_blank" rel="noopener noreferrer">İndir</a>
            </div>
          </article>
        `;
        container.innerHTML += cardHTML;
      });
    }

    // Anlık Veritabanı Değişikliklerini Dinleme (Realtime)
    supabase
      .channel('public:AppDB')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'AppDB' }, () => {
        uygulamalariYukle();
      })
      .subscribe();

    // Sayfa Yüklendiğinde İlk Çalıştırma
    uygulamalariYukle();
  </script>
</body>
</html>
