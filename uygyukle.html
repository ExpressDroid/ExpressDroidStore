<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpressDroid - Uygulama Yükleme Paneli</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0b0f;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .panel-box {
            background: #161622;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 500px;
            border: 1px solid #27273d;
        }
        h2 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: 600;
        }
        .field {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #9494b8;
            font-size: 13px;
            font-weight: 500;
        }
        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #2e2e48;
            border-radius: 8px;
            background-color: #0d0d14;
            color: #fff;
            font-size: 14px;
        }
        input[type="file"] {
            padding: 9px;
            cursor: pointer;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #00ff88;
            color: #0b0b0f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: background 0.2s;
            margin-top: 5px;
        }
        .submit-btn:hover {
            background: #00cc6a;
        }
        #status {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="panel-box">
    <h2>ExpressDroid Dosya Yükleme Paneli</h2>
    <form id="uploadForm">
        <div class="field">
            <label for="appName">Uygulama Adı</label>
            <input type="text" id="appName" required>
        </div>
        <div class="field">
            <label for="appDesc">Açıklama</label>
            <textarea id="appDesc" required></textarea>
        </div>
        <div class="field">
            <label for="appIconFile">Uygulama İkonu (Görsel)</label>
            <input type="file" id="appIconFile" accept="image/*" required>
        </div>
        <div class="field">
            <label for="appApkFile">APK Dosyası</label>
            <input type="file" id="appApkFile" accept=".apk" required>
        </div>
        <div class="field">
            <label for="appSha">SHA-256 (Opsiyonel)</label>
            <input type="text" id="appSha">
        </div>
        <button type="submit" class="submit-btn">Dosyaları Yükle ve Kaydet</button>
    </form>
    <p id="status"></p>
</div>

<script>
    const SUPABASE_URL = 'SENIN_SUPABASE_URL_ADRESIN';
    const SUPABASE_ANON_KEY = 'SENIN_SUPABASE_ANON_KEY_DEGERIN';
    const GIZLI_TOKEN = typeof process !== 'undefined' && process.env && process.env.SUPABASE_APP_TOKEN ? process.env.SUPABASE_APP_TOKEN : '&%&%&%&/(/(&%&%&%';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false },
        global: {
            headers: {
                'x-app-token': GIZLI_TOKEN
            }
        }
    });

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('appName').value;
        const description = document.getElementById('appDesc').value;
        const iconFile = document.getElementById('appIconFile').files[0];
        const apkFile = document.getElementById('appApkFile').files[0];
        const sha256 = document.getElementById('appSha').value;
        const status = document.getElementById('status');

        if (!iconFile || !apkFile) {
            status.style.color = '#ff4d4d';
            status.innerText = 'Lütfen hem ikon hem de APK dosyası seçin!';
            return;
        }

        status.style.color = '#ffa500';
        status.innerText = 'Dosyalar yükleniyor...';

        try {
            // 1. İkonu Storage'a yükle
            const iconFileName = Date.now() + '_' + iconFile.name;
            const { error: iconError } = await _supabase.storage
                .from('icons')
                .upload(iconFileName, iconFile);

            if (iconError) throw new Error('İkon yüklenemedi: ' + iconError.message);

            const { data: iconData } = _supabase.storage
                .from('icons')
                .getPublicUrl(iconFileName);

            // 2. APK'yı Storage'a yükle
            const apkFileName = Date.now() + '_' + apkFile.name;
            const { error: apkError } = await _supabase.storage
                .from('apks')
                .upload(apkFileName, apkFile);

            if (apkError) throw new Error('APK yüklenemedi: ' + apkError.message);

            const { data: apkData } = _supabase.storage
                .from('apks')
                .getPublicUrl(apkFileName);

            // 3. Veritabanına kaydet
            status.innerText = 'Veritabanına kaydediliyor...';
            const { error: dbError } = await _supabase
                .from('AppDB')
                .insert([{ 
                    name: name, 
                    description: description, 
                    icon: iconData.publicUrl, 
                    url: apkData.publicUrl, 
                    sha256: sha256 
                }]);

            if (dbError) throw new Error('Veritabanı hatası: ' + dbError.message);

            status.style.color = '#00ff88';
            status.innerText = 'Uygulama ve dosyalar başarıyla yüklendi!';
            document.getElementById('uploadForm').reset();

        } catch (err) {
            status.style.color = '#ff4d4d';
            status.innerText = 'Hata: ' + err.message;
        }
    });
</script>

</body>
</html>
